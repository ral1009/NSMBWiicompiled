name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translator:
    name: Translator (build + test)
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore translator/Translator.sln

      - name: Build
        run: dotnet build translator/Translator.sln -c Release --no-restore

      - name: Test
        run: dotnet test translator/Translator.sln -c Release --no-build --verbosity normal

  linux-launcher:
    name: Linux launcher
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libudev-dev
      - name: Build launcher and product compile check
        run: cmake -S runtime/tests/linux -B build-linux-tests -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ && cmake --build build-linux-tests --parallel 4
      - name: Test launcher and AppDir
        run: |
          ./build-linux-tests/fiber_stack
          ./build-linux-tests/memory_fault
          python3 projects/nsmbw/tools/test_expand_embeds.py
          python3 projects/nsmbw/tools/test_linux_launcher.py build-linux-tests
