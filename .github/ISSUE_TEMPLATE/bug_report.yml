name: Bug report
description: Something is broken, crashes, or looks wrong
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please check the README's **Known issues** and the
        existing issues first.

        **Never attach or link game files** (disc images, extracted files, saves).
        Issues containing them will be deleted.

  - type: input
    id: version
    attributes:
      label: Version
      description: Release number, or the zip name (`NSMBWCompiled-<commit>.zip`)
      placeholder: e.g. v0.2.1
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem, and what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Which world/level, what you pressed, what was on screen.
      placeholder: |
        1. Load the save at World 1
        2. Enter 1-3
        3. Pause and press Continue
        4. ...
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Sometimes
        - Only once
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Log file
      description: |
        Drag and drop `nsmbw_data\NSMBWCompiled.log` (next to the exe) into this box.
        Attach the whole file from the run where the problem happened; don't paste a snippet.
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: Screenshots or video
      description: Required for anything visual. Drag and drop into this box.

  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 24H2
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU and driver version
      placeholder: e.g. RTX 3060, driver 566.36
    validations:
      required: true

  - type: textarea
    id: settings
    attributes:
      label: Settings changed from default
      description: Resolution scale, frame rate, HD textures, controls - anything you changed. Leave empty if none.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and the README's Known issues.
          required: true
        - label: This report contains no game files, disc images or save files.
          required: true
